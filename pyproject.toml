[project]
name = "brightcon-environ"
version = "0.1.0.dev2"
description = "Rebuild JupyterHub Python environments from GitHub push webhooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.scripts]
environ = "brightcon_environ.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",
    "ruff>=0.14",
    "pre-commit>=4.0",
]
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brightcon_environ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds a real environment on disk (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
